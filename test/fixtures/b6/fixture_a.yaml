mixed-port: 7891
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://dns.example.invalid/dns-query
tun:
  enable: false
  stack: gvisor
  mtu: 1500
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080
    TLS:
      ports:
        - 443
proxies:
  - name: A-SS
    type: ss
    server: 192.0.2.10
    port: 8388
    cipher: aes-256-gcm
    password: pass-a
  - name: A-VLESS
    type: vless
    server: 198.51.100.20
    port: 443
    uuid: 11111111-2222-3333-4444-555555555555
    tls: true
    servername: example.invalid
  - name: A-Trojan
    type: trojan
    server: 203.0.113.30
    port: 443
    password: pass-c
    sni: example.invalid
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - A-SS
      - A-VLESS
      - A-Trojan
  - name: AUTO
    type: url-test
    proxies:
      - A-SS
      - A-VLESS
    url: https://www.gstatic.com/generate_204
    interval: 300
rules:
  - DOMAIN-SUFFIX,example.invalid,PROXY
  - IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT
  - MATCH,PROXY
